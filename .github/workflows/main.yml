name: Sync gh-pages with main
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gh-pages to the latest main
        run: |
          # Point gh-pages at the current commit on main
          git push -f origin HEAD:gh-pages
